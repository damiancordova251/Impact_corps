<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Morning Wear">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Morning Wear</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/app-icon.svg">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <p class="brand">Morning Wear</p>
        <p class="status-pill" id="statusPill">Ready</p>
      </header>

      <section class="recommendation-panel" aria-live="polite">
        <img class="app-icon" src="icons/app-icon.svg" alt="">
        <p class="kicker" id="kicker">Today</p>
        <div class="checklist-heading">
          <h1 class="recommendation-title" id="recommendationTitle">Morning Checklist:</h1>
          <div class="completion-mark" id="completionMark" aria-hidden="true">&#10003;</div>
        </div>
        <p class="reason" id="reasonText">Ready when you are.</p>
        <ul class="item-list" id="itemList" aria-label="Morning checklist"></ul>
        <button class="primary-action" id="primaryAction" type="button">Use current location</button>
      </section>

      <section class="facts-section" aria-label="Key weather facts">
        <div class="fact-row">
          <span>Feels like</span>
          <strong id="feelsFact">--</strong>
        </div>
        <div class="fact-row">
          <span>High / low</span>
          <strong id="rangeFact">--</strong>
        </div>
        <div class="fact-row">
          <span>Rain chance</span>
          <strong id="rainFact">--</strong>
        </div>
        <div class="fact-row">
          <span>Wind</span>
          <strong id="windFact">--</strong>
        </div>
      </section>

      <footer class="footer-note">
        <p id="lastUpdated">Location is used only for this forecast.</p>
      </footer>
    </main>
  </body>
</html>
