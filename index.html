<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Morning Wear">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Morning Wear</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/app-icon.svg">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <p class="brand">Morning Wear</p>
        <p class="status-pill" id="statusPill">Ready</p>
      </header>

      <nav class="screen-nav" aria-label="App screens">
        <button class="screen-tab is-active" id="checklistTab" type="button" aria-controls="checklistScreen" aria-selected="true">Checklist</button>
        <button class="screen-tab" id="weatherTab" type="button" aria-controls="weatherScreen" aria-selected="false">Weather</button>
      </nav>

      <div class="screen-track" id="screenTrack">
        <section class="recommendation-panel app-screen is-active" id="checklistScreen" aria-live="polite">
          <img class="app-icon" src="icons/app-icon.svg" alt="">
          <p class="kicker" id="kicker">Today</p>
          <div class="checklist-heading">
            <h1 class="recommendation-title" id="recommendationTitle">Checklist:</h1>
            <div class="completion-mark" id="completionMark" aria-hidden="true">&#10003;</div>
          </div>
          <p class="reason" id="reasonText">Ready when you are.</p>
          <ul class="item-list" id="itemList" aria-label="Morning checklist"></ul>
          <button class="primary-action" id="primaryAction" type="button">Use current location</button>
        </section>

        <section class="weather-screen app-screen" id="weatherScreen" aria-label="Weather details">
          <div class="weather-hero">
            <p class="kicker">Weather Details</p>
            <h1 class="temperature-title" id="temperatureTitle">--</h1>
            <div class="temperature-summary">
              <div>
                <span>High / low</span>
                <strong id="rangeFact">--</strong>
              </div>
              <div>
                <span>Feels like</span>
                <strong id="feelsFact">--</strong>
              </div>
            </div>
          </div>

          <div class="weather-detail-list">
            <section class="weather-detail-section" aria-label="Rain">
              <span>Rain chance</span>
              <strong id="rainFact">--</strong>
            </section>
            <section class="weather-detail-section" aria-label="Current precipitation">
              <span>Current precipitation</span>
              <strong id="precipFact">--</strong>
            </section>
            <section class="weather-detail-section" aria-label="Wind">
              <span>Wind</span>
              <strong id="windFact">--</strong>
            </section>
            <section class="weather-detail-section" aria-label="Conditions">
              <span>Conditions</span>
              <strong id="conditionFact">--</strong>
            </section>
            <section class="weather-detail-section" aria-label="Last updated">
              <span>Last updated</span>
              <strong id="lastUpdatedFact">--</strong>
            </section>
          </div>
        </section>
      </div>

      <footer class="footer-note">
        <p id="appStatus">Location is used only for this forecast.</p>
      </footer>
    </main>
  </body>
</html>
